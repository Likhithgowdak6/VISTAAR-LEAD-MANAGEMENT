<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      `viewport-fit=cover` lets the page paint under a notch and the gesture bar, which is what
      makes `env(safe-area-inset-*)` report anything other than 0. Without it the Android shell
      letterboxes the app and the masthead sits in a grey band. The insets are then applied in
      index.css so nothing interactive ends up underneath the system UI.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0e13" />

    <!--
      Bebas Neue: the masthead and eyebrows - condensed poster caps, the type a photography
      studio prints its own name in. IBM Plex Sans for the interface, IBM Plex Mono for every
      number in it. Preconnected because this app is opened dozens of times a day and a
      re-flowing masthead on each load is the cheapest thing here to get wrong.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Vistaar · Lead Console</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
