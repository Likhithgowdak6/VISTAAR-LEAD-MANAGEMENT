ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'

    /*
     * Firebase Cloud Messaging, declared HERE so one version serves two modules.
     *
     * The push-notifications plugin reads `rootProject.ext.firebaseMessagingVersion` and falls
     * back to 25.0.1 when it is absent - which it was, so this pins what the build was already
     * resolving rather than changing it. The app module now needs the same artifact, because
     * VistaarMessagingService extends FirebaseMessagingService and the plugin exposes it with
     * `implementation`, which Gradle deliberately keeps off a consumer's compile classpath.
     *
     * Two modules naming the version independently is how they end up a minor release apart,
     * with Gradle quietly resolving one and the other's API assumptions silently wrong.
     */
    firebaseMessagingVersion = '25.0.1'
}